aid: tradeking
name: TradeKing
description: >-
  TradeKing was a US online brokerage offering commission-based self-directed trading of stocks
  and options, backed by Battery Ventures. It pioneered one of the first public brokerage APIs,
  letting developers manage accounts, place equity and options orders, stream real-time market
  quotes, and manage watchlists over OAuth 1.0. TradeKing was acquired by Ally Financial in 2016
  and rebranded as Ally Invest; its API surface lives on as the Ally Invest API (profiled
  separately as ally-invest in this network). tradeking.com now redirects to ally.com/invest and
  the historical API hosts no longer resolve. This profile is maintained as a historical record.
